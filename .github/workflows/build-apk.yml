name: 🐸 Build & Package Frogazz APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Frogazz Sport Analyse APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Wrapper & Build APK
        run: |
          cd flutter_app
          rm -rf android
          flutter create . --platforms=android --org=pro.frogazz
          # Ajouter les permissions Internet et le nom officiel dans le manifeste Android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label=".*"/android:label="Frogazz Sport Analyse"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frogazz-Sport-Analyse-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
