name: 🐸 Build & Package Frogazz APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Frogazz Sport Analyse APK (Release & Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Generate Official Android Wrapper & Configure App
        run: |
          cd flutter_app
          rm -rf android
          flutter create . --platforms=android --org=pro.frogazz
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label=".*"/android:label="Frogazz Sport Analyse"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK Release
        run: |
          cd flutter_app
          flutter build apk --release --no-tree-shake-icons

      - name: Build APK Debug
        run: |
          cd flutter_app
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frogazz-Sport-Analyse-APK-Release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frogazz-Sport-Analyse-APK-Debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
