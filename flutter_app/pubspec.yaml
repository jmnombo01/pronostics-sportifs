name: frogazz_sport_analyse
description: Application mobile professionnelle de pronostics sportifs Frogazz Sport Analyse (VIP & Montante) en Flutter Material 3 avec grenouille interactive, Riverpod, GoRouter et PayDunya/CinetPay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
