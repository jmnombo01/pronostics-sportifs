name: pronostics_sportifs
description: Application mobile professionnelle de pronostics sportifs (VIP & Montante) en Flutter Material 3 avec Riverpod, GoRouter, Dio et CinetPay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  shimmer: ^3.0.0
  firebase_core: ^2.31.0
  firebase_messaging: ^14.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
