# ⚠️ La base de données PostgreSQL existe déjà sur Render (frogazz_db).
# Elle est reliée au serveur via la variable d'environnement DATABASE_URL.
# (Ne pas re-créer de base : le plan gratuit n'autorise qu'une seule base.)

services:
  - type: web
    name: pronostics-api-server
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://pronostics-api-server.onrender.com
      # À renseigner manuellement dans le dashboard Render :
      # DATABASE_URL = postgresql://frogazz_db_user:MOT_DE_PASSE@dpg-da4kgec9v7es738fghvg-a.frankfurt-postgres.render.com/frogazz_db
      # LIGDICASH_API_KEY = (clé API LigdiCash)
      # LIGDICASH_API_TOKEN = (token API LigdiCash)
      - key: LIGDICASH_STORE_NAME
        value: Frogazz Sport Analyse
      - key: LIGDICASH_WEBSITE_URL
        value: https://pronostics-api-server.onrender.com
      - key: LIGDICASH_CALLBACK_URL
        value: https://pronostics-api-server.onrender.com/api/v1/ligdicash/callback
