# ⚠️ La base de données PostgreSQL existe déjà sur Render (frogazz_db).
# Elle est reliée au serveur via la variable d'environnement DATABASE_URL.
# (Ne pas re-créer de base : le plan gratuit n'autorise qu'une seule base.)

services:
  - type: web
    name: pronostics-api-server
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://pronostics-api-server.onrender.com
      # À renseigner manuellement dans le dashboard Render :
      # DATABASE_URL = postgresql://frogazz_db_user:MOT_DE_PASSE@dpg-da4kgec9v7es738fghvg-a.frankfurt-postgres.render.com/frogazz_db
      - key: PAYDUNYA_MODE
        value: live
      - key: PAYDUNYA_IPN_URL
        value: https://pronostics-api-server.onrender.com/api/v1/paydunya/ipn
      - key: PAYDUNYA_RETURN_URL
        value: https://pronostics-api-server.onrender.com/api/v1/paydunya/return
      - key: PAYDUNYA_CANCEL_URL
        value: https://pronostics-api-server.onrender.com/api/v1/paydunya/cancel
      - key: PAYDUNYA_CURRENCY
        value: XOF
